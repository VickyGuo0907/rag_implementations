<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1415">
  <defs>
    <style>
      * { font-family: "Courier New", monospace; }
      .title { font-size: 36px; font-weight: 700; fill: #00d9ff; }
      .phase-title { font-size: 22px; font-weight: 700; fill: #00ffaa; }
      .stage-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; fill: #00ffaa; font-weight: 600; }
      .small-label { font-size: 13px; fill: #00ffaa; font-weight: 600; }
      .data-label { font-size: 12px; fill: #00d9ff; font-weight: 500; }
      .phase-label { font-size: 14px; fill: #0099ff; font-style: italic; }
      .description { font-size: 13px; fill: #00d9ff; opacity: 0.95; }
      .summary { font-size: 12px; fill: #aaffff; opacity: 0.9; }
      .note { font-size: 12px; fill: #aaffff; opacity: 0.85; }
    </style>
    <marker id="arrowhead-cyan" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00ffaa" />
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00ff00" />
    </marker>
    <marker id="arrowhead-yellow" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ffcc00" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ff00ff" />
    </marker>
    <marker id="arrowhead-pink" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ff66ff" />
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a2540" stroke-width="0.5"/>
    </pattern>
  </defs>
  
<rect width="1700" height="1415" fill="#0a1628"/><rect width="1700" height="1415" fill="url(#grid)"/>
<text x="850" y="45" class="title" text-anchor="middle" filter="url(#glow)">Multi-modal RAG Data Flow Architecture</text>
<rect x="30" y="70" width="1640" height="640" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>
<text x="55" y="108" class="phase-title" >[OFFLINE PHASE]</text>
<text x="55" y="132" class="phase-label" >Extract → Describe with a Vision LLM → Embed Text-Only (One-Time)</text>
<rect x="55" y="148" width="1590" height="55" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
<text x="70" y="168" class="summary" font-weight="600">📌 SUMMARY: Tables and images are pulled out of each document. A vision LLM turns them into text</text>
<text x="70" y="188" class="summary" >summaries/captions that are embedded alongside text chunks, so ANY text embedding model works.</text>
<rect x="50" y="220" width="1600" height="215" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
<text x="70" y="244" class="stage-title" fill="#4ac0ff">① EXTRACT — Split Each Document by Modality</text>
<g filter="url(#glow)"><rect x="70" y="262" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="75" y="267" width="180" height="90" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="8"/><text x="165.0" y="304.0" class="label" text-anchor="middle" font-size="16">📄 Documents</text><text x="165.0" y="326.0" class="data-label" text-anchor="middle">md / txt / pdf</text></g>
<g filter="url(#glow)"><rect x="400" y="252" width="300" height="54" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="405" y="257" width="290" height="44" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="550.0" y="271.0" class="label" text-anchor="middle" font-size="16">✂️ Text</text><text x="550.0" y="293.0" class="data-label" text-anchor="middle">chunked as usual</text></g>
<g filter="url(#glow)"><rect x="400" y="312" width="300" height="54" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="405" y="317" width="290" height="44" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="550.0" y="331.0" class="label" text-anchor="middle" font-size="16">📊 Tables</text><text x="550.0" y="353.0" class="data-label" text-anchor="middle">markdown pipe tables</text></g>
<g filter="url(#glow)"><rect x="400" y="372" width="300" height="54" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="405" y="377" width="290" height="44" fill="none" stroke="#ff66ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="550.0" y="391.0" class="label" text-anchor="middle" font-size="16">🖼️ Images</text><text x="550.0" y="413.0" class="data-label" text-anchor="middle">md refs + PDF-embedded</text></g>
<path d="M 260 300 L 330 300 L 330 279 L 400 279" stroke="#00ffaa" stroke-width="3" fill="none" marker-end="url(#arrowhead-cyan)"/>
<path d="M 260 312 L 400 339" stroke="#00ffaa" stroke-width="3" fill="none" marker-end="url(#arrowhead-cyan)"/>
<path d="M 260 324 L 330 324 L 330 399 L 400 399" stroke="#00ffaa" stroke-width="3" fill="none" marker-end="url(#arrowhead-cyan)"/>
<text x="760" y="285" class="note" >• tables found by header + separator row</text>
<text x="760" y="310" class="note" >• ![alt](path) resolved next to the source file</text>
<text x="760" y="335" class="note" >• PDF images saved via pypdf; tiny icons skipped</text>
<text x="760" y="360" class="note" >• missing / remote images skipped with a warning</text>
<rect x="50" y="450" width="1600" height="245" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
<text x="360" y="474" class="stage-title" fill="#4ac0ff">② DESCRIBE + ③ EMBED — Everything Becomes Searchable Text</text>
<g filter="url(#glow)"><rect x="70" y="485" width="250" height="100" fill="none" stroke="#ff66ff" stroke-width="3" rx="10"/><rect x="75" y="490" width="240" height="90" fill="none" stroke="#ff66ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="195.0" y="527.0" class="label" text-anchor="middle" font-size="16">👁️ Vision LLM</text><text x="195.0" y="549.0" class="data-label" text-anchor="middle">caption images</text><text x="195.0" y="567.0" class="data-label" text-anchor="middle">summarize tables</text></g>
<g filter="url(#glow)"><rect x="400" y="485" width="250" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="405" y="490" width="240" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="525.0" y="527.0" class="label" text-anchor="middle" font-size="16">📝 Descriptions</text><text x="525.0" y="549.0" class="data-label" text-anchor="middle">caption / summary text</text><text x="525.0" y="567.0" class="data-label" text-anchor="middle">fallback: alt text / raw</text></g>
<g filter="url(#glow)"><rect x="730" y="485" width="250" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="735" y="490" width="240" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="855.0" y="527.0" class="label" text-anchor="middle" font-size="16">🧠 Embeddings</text><text x="855.0" y="549.0" class="data-label" text-anchor="middle">text embedding model</text></g>
<g filter="url(#glow)"><rect x="1060" y="485" width="250" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="1065" y="490" width="240" height="90" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="1185.0" y="527.0" class="label" text-anchor="middle" font-size="16">💾 Vector Store</text><text x="1185.0" y="549.0" class="data-label" text-anchor="middle">text chunks + descriptions</text><text x="1185.0" y="567.0" class="data-label" text-anchor="middle">metadata.modality</text></g>
<line x1="320" y1="535" x2="400" y2="535" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="316.0" y="521.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="360.0" y="540.0" class="data-label" text-anchor="middle" font-weight="600">Describe</text>
<line x1="650" y1="535" x2="730" y2="535" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="646.0" y="521.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="690.0" y="540.0" class="data-label" text-anchor="middle" font-weight="600">Embed</text>
<line x1="980" y1="535" x2="1060" y2="535" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="976.0" y="521.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="1020.0" y="540.0" class="data-label" text-anchor="middle" font-weight="600">Store</text>
<text x="70" y="625" class="note" font-weight="600">💡 The ORIGINALS (raw table markdown, image file path) ride along in metadata — only descriptions are embedded.</text>
<text x="70" y="650" class="note" >🛡️ A failed or empty description degrades to alt text / raw table prefix; indexing never aborts.</text>
<path d="M 165 362 L 165 485" stroke="#ff66ff" stroke-width="3" fill="none" marker-end="url(#arrowhead-pink)"/>
<rect x="30" y="730" width="1640" height="655" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>
<text x="55" y="778" class="phase-title" >[ONLINE PHASE]</text>
<text x="55" y="802" class="phase-label" >Retrieve Across Modalities → Resolve Originals → Answer With Text + Images (Per Query)</text>
<rect x="55" y="818" width="1590" height="55" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
<text x="70" y="840" class="summary" font-weight="600">📌 SUMMARY: One text query retrieves text chunks, table summaries, and image captions together. Hits are</text>
<text x="70" y="860" class="summary" >swapped for their originals; the vision LLM reads the actual tables and attached images to answer.</text>
<rect x="50" y="890" width="1600" height="190" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
<text x="70" y="914" class="stage-title" fill="#4ac0ff">④ RETRIEVE — Cross-Modal Search</text>
<g filter="url(#glow)"><rect x="70" y="930" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="75" y="935" width="180" height="90" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="165.0" y="972.0" class="label" text-anchor="middle" font-size="16">❓ Query</text><text x="165.0" y="994.0" class="data-label" text-anchor="middle">User Input</text></g>
<line x1="260" y1="980" x2="340" y2="980" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="256.0" y="966.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="300.0" y="985.0" class="data-label" text-anchor="middle" font-weight="600">Embed</text>
<g filter="url(#glow)"><rect x="340" y="930" width="250" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="345" y="935" width="240" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="465.0" y="972.0" class="label" text-anchor="middle" font-size="16">🔎 Top-k Search</text><text x="465.0" y="994.0" class="data-label" text-anchor="middle">text vs. text vectors</text><text x="465.0" y="1012.0" class="data-label" text-anchor="middle">any modality can win</text></g>
<line x1="590" y1="980" x2="670" y2="980" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="586.0" y="966.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="630.0" y="985.0" class="data-label" text-anchor="middle" font-weight="600">Hits</text>
<g filter="url(#glow)"><rect x="670" y="930" width="250" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="675" y="935" width="240" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="795.0" y="972.0" class="label" text-anchor="middle" font-size="16">🧩 Mixed Hits</text><text x="795.0" y="994.0" class="data-label" text-anchor="middle">text | table | image</text></g>
<text x="960" y="960" class="note" fill="#ff66ff">• chart question → image caption ranks first</text>
<text x="960" y="982" class="note" fill="#ffcc00">• table question → table summary ranks first</text>
<text x="960" y="1004" class="note" >• same index, same query, no modality routing needed</text>
<rect x="50" y="1110" width="1600" height="190" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
<text x="360" y="1134" class="stage-title" fill="#4ac0ff">⑤ ANSWER — Originals Back In, Vision LLM Reads Them</text>
<g filter="url(#glow)"><rect x="70" y="1150" width="270" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="75" y="1155" width="260" height="90" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="205.0" y="1192.0" class="label" text-anchor="middle" font-size="16">🧱 build_context</text><text x="205.0" y="1214.0" class="data-label" text-anchor="middle">text → chunk · table → raw</text><text x="205.0" y="1232.0" class="data-label" text-anchor="middle">image → caption + file</text></g>
<line x1="340" y1="1200" x2="420" y2="1200" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="336.0" y="1186.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="380.0" y="1205.0" class="data-label" text-anchor="middle" font-weight="600">Attach</text>
<g filter="url(#glow)"><rect x="420" y="1150" width="270" height="100" fill="none" stroke="#ff66ff" stroke-width="3" rx="10"/><rect x="425" y="1155" width="260" height="90" fill="none" stroke="#ff66ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="555.0" y="1192.0" class="label" text-anchor="middle" font-size="16">🖼️ Attached Images</text><text x="555.0" y="1214.0" class="data-label" text-anchor="middle">max_answer_images</text><text x="555.0" y="1232.0" class="data-label" text-anchor="middle">deduplicated</text></g>
<line x1="690" y1="1200" x2="770" y2="1200" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="686.0" y="1186.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="730.0" y="1205.0" class="data-label" text-anchor="middle" font-weight="600">Prompt</text>
<g filter="url(#glow)"><rect x="770" y="1150" width="250" height="100" fill="none" stroke="#ff66ff" stroke-width="3" rx="10"/><rect x="775" y="1155" width="240" height="90" fill="none" stroke="#ff66ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="895.0" y="1192.0" class="label" text-anchor="middle" font-size="16">👁️ Vision LLM</text><text x="895.0" y="1214.0" class="data-label" text-anchor="middle">text + images</text><text x="895.0" y="1232.0" class="data-label" text-anchor="middle">grounded answer</text></g>
<line x1="1020" y1="1200" x2="1100" y2="1200" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<g filter="url(#glow)"><rect x="1100" y="1150" width="280" height="100" fill="none" stroke="#00ff00" stroke-width="3" rx="10"/><rect x="1105" y="1155" width="270" height="90" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="1240.0" y="1192.0" class="label" text-anchor="middle" font-size="16">📦 RAGResult</text><text x="1240.0" y="1214.0" class="data-label" text-anchor="middle">answer + sources</text><text x="1240.0" y="1232.0" class="data-label" text-anchor="middle">modalities in metadata</text></g>
<path d="M 795 1030 L 795 1075 L 205 1075 L 205 1150" stroke="#00ffaa" stroke-width="3" fill="none" marker-end="url(#arrowhead-cyan)"/>
<rect x="430" y="1061" width="140" height="26" fill="#0a1628" opacity="0.95"/><text x="500" y="1080" class="data-label" text-anchor="middle" font-weight="600">resolve originals</text>
<text x="70" y="1340" class="note" >metadata: modalities_retrieved, images_attached · intermediate_steps: modalities, attached_images</text>
<text x="70" y="1370" class="note" >Vision model must accept image input (e.g. qwen3.8-27b, gemma-4-31b); set multimodal_rag.vision_model if different from lmstudio.model.</text>
</svg>