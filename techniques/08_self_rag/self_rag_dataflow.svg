<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1260">
  <defs>
    <style>
      * { font-family: "Courier New", monospace; }
      .title { font-size: 36px; font-weight: 700; fill: #00d9ff; }
      .phase-title { font-size: 22px; font-weight: 700; fill: #00ffaa; }
      .stage-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; fill: #00ffaa; font-weight: 600; }
      .small-label { font-size: 13px; fill: #00ffaa; font-weight: 600; }
      .data-label { font-size: 12px; fill: #00d9ff; font-weight: 500; }
      .phase-label { font-size: 14px; fill: #0099ff; font-style: italic; }
      .description { font-size: 13px; fill: #00d9ff; opacity: 0.95; }
      .summary { font-size: 12px; fill: #aaffff; opacity: 0.9; }
      .note { font-size: 12px; fill: #aaffff; opacity: 0.85; }
    </style>
    <marker id="arrowhead-cyan" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00ffaa" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ff00ff" />
    </marker>
    <marker id="arrowhead-teal" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00d9ff" />
    </marker>
    <marker id="arrowhead-yellow" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ffcc00" />
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a2540" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1700" height="1260" fill="#0a1628"/>
  <rect width="1700" height="1260" fill="url(#grid)"/>
  <text x="850" y="45" class="title" text-anchor="middle" filter="url(#glow)">Self-RAG Data Flow Architecture</text>

  <!-- OFFLINE PHASE -->
  <rect x="30" y="70" width="1640" height="280" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>
  <text x="55" y="108" class="phase-title">[OFFLINE PHASE]</text>
  <text x="55" y="132" class="phase-label">Indexing &amp; Vector Store Preparation (One-Time — Shared Across All Queries)</text>
  <rect x="55" y="148" width="1590" height="55" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
  <text x="70" y="168" class="summary" font-weight="600">📌 SUMMARY: Identical to Naive RAG — documents are chunked, embedded, and indexed into a</text>
  <text x="70" y="188" class="summary">vector store once. Self-RAG's reflection loop only affects the ONLINE phase below.</text>
  <g filter="url(#glow)">
    <rect x="55" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="60" y="240" width="180" height="90" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="150.0" y="269" class="label" text-anchor="middle" font-size="18">📄 Documents</text>
    <text x="150.0" y="293" class="data-label" text-anchor="middle">Raw Text</text>
  </g>
  <line x1="245" y1="285" x2="315" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="252.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="280.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Split</text>
  <g filter="url(#glow)">
    <rect x="315" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="320" y="240" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="410.0" y="269" class="label" text-anchor="middle" font-size="18">✂️ Chunks</text>
    <text x="410.0" y="293" class="data-label" text-anchor="middle">512 tok, overlap=50</text>
  </g>
  <line x1="505" y1="285" x2="575" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="512.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="540.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Embed</text>
  <g filter="url(#glow)">
    <rect x="575" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="580" y="240" width="180" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="670.0" y="269" class="label" text-anchor="middle" font-size="18">🧠 Embeddings</text>
    <text x="670.0" y="293" class="data-label" text-anchor="middle">nomic-embed-text</text>
  </g>
  <line x1="765" y1="285" x2="835" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="772.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="800.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Store</text>
  <g filter="url(#glow)">
    <rect x="835" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="840" y="240" width="180" height="90" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="930.0" y="269" class="label" text-anchor="middle" font-size="18">💾 Vector Store</text>
    <text x="930.0" y="293" class="data-label" text-anchor="middle">ChromaDB</text>
  </g>
  <text x="1155" y="253" class="note" font-weight="600">💡 Runs once per document set, reused for unlimited queries below</text>

  <!-- ONLINE PHASE -->
  <text x="55" y="418" class="phase-title">[ONLINE PHASE]</text>
  <text x="55" y="442" class="phase-label">Retrieval Decision → Relevance Grading → Generate &amp; Critique (Per Query, Reflective)</text>
  <rect x="55" y="458" width="1590" height="70" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
  <text x="70" y="480" class="summary" font-weight="600">📌 SUMMARY: An LLM decides if retrieval is even needed, grades each candidate's relevance,</text>
  <text x="70" y="496" class="summary">generates an answer, then critiques whether that answer is actually grounded in the context —</text>
  <text x="70" y="512" class="summary">looping back with a refined query if it isn't, up to max_iterations times.</text>
  <rect x="30" y="370" width="1640" height="810" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>

  <!-- Stage 1: Retrieval Decision -->
  <rect x="50" y="550" width="1600" height="165" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
  <text x="70" y="574" class="stage-title" fill="#4ac0ff">① RETRIEVAL DECISION — Is Retrieval Even Necessary?</text>
  <g filter="url(#glow)">
    <rect x="70" y="590" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="75" y="595" width="180" height="90" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="165.0" y="624" class="label" text-anchor="middle" font-size="16">❓ Query</text>
    <text x="165.0" y="648" class="data-label" text-anchor="middle">User Input</text>
  </g>
  <line x1="260" y1="640" x2="340" y2="640" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="256.0" y="626" width="88" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="300.0" y="645" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Judge</text>
  <g filter="url(#glow)">
    <rect x="340" y="590" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="345" y="595" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="435.0" y="619" class="label" text-anchor="middle" font-size="16">🧭 Necessity Score</text>
    <text x="435.0" y="643" class="data-label" text-anchor="middle">LLM rates 0.0-1.0:</text>
    <text x="435.0" y="661" class="data-label" text-anchor="middle">does this need retrieval?</text>
  </g>
  <line x1="530" y1="640" x2="610" y2="640" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="538.0" y="626" width="64" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="570.0" y="645" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Route</text>
  <g filter="url(#glow)">
    <rect x="610" y="590" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="615" y="595" width="180" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="705.0" y="619" class="label" text-anchor="middle" font-size="16">⚖️ score ≥ threshold?</text>
    <text x="705.0" y="643" class="data-label" text-anchor="middle">retrieve_token_threshold</text>
    <text x="705.0" y="661" class="data-label" text-anchor="middle">default 0.5</text>
  </g>

  <path d="M 800 615 Q 1040 590 1200 630" stroke="#ffcc00" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-yellow)" stroke-dasharray="5,4"/>
  <rect x="960.0" y="588" width="120" height="24" fill="#0a1628" opacity="0.95"/>
  <text x="1020.0" y="605" class="data-label" text-anchor="middle" font-size="12" font-weight="600" fill="#ffcc00">no → skip retrieval</text>
  <g filter="url(#glow)">
    <rect x="1200" y="630" width="270" height="65" fill="none" stroke="#ffcc00" stroke-width="2.5" rx="8"/>
    <rect x="1204" y="634" width="262" height="57" fill="none" stroke="#00ff00" stroke-width="1.2" opacity="0.4" rx="6"/>
    <text x="1331.0" y="656" class="small-label" text-anchor="middle" font-size="14" fill="#ffcc00">⚡ Direct Answer</text>
    <text x="1331.0" y="676" class="data-label" text-anchor="middle" font-size="11">No retrieval — answered from</text>
    <text x="1331.0" y="691" class="data-label" text-anchor="middle" font-size="10">the model's own knowledge</text>
  </g>
  <text x="860" y="682" class="note">💡 Skips retrieval entirely when the model is confident it already knows the answer</text>

  <!-- Stage 2: Retrieve & Grade -->
  <rect x="50" y="755" width="1600" height="165" fill="none" stroke="#ffcc55" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
  <text x="70" y="779" class="stage-title" fill="#ffcc55">② RETRIEVE &amp; GRADE — Relevance Filtering</text>
  <g filter="url(#glow)">
    <rect x="70" y="795" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="75" y="800" width="180" height="90" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="165.0" y="824" class="label" text-anchor="middle" font-size="16">🔍 Retrieve</text>
    <text x="165.0" y="848" class="data-label" text-anchor="middle">vector kNN,</text>
    <text x="165.0" y="866" class="data-label" text-anchor="middle">k=top_k candidates</text>
  </g>
  <line x1="260" y1="845" x2="340" y2="845" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="266.0" y="831" width="76" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="304.0" y="850" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Grade</text>
  <g filter="url(#glow)">
    <rect x="340" y="795" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="345" y="800" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="435.0" y="819" class="label" text-anchor="middle" font-size="16">🧮 Relevance Grading</text>
    <text x="435.0" y="843" class="data-label" text-anchor="middle">one batched LLM call</text>
    <text x="435.0" y="861" class="data-label" text-anchor="middle">scores every candidate</text>
  </g>
  <line x1="530" y1="845" x2="610" y2="845" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="536.0" y="831" width="68" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="570.0" y="850" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Filter</text>
  <g filter="url(#glow)">
    <rect x="610" y="795" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="615" y="800" width="180" height="90" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="705.0" y="819" class="label" text-anchor="middle" font-size="16">📋 Relevant Docs</text>
    <text x="705.0" y="843" class="data-label" text-anchor="middle">≥ relevance_threshold</text>
    <text x="705.0" y="861" class="data-label" text-anchor="middle">default 0.6</text>
  </g>
  <text x="860" y="823" class="note">💡 One call grades ALL candidates at once — cheaper than one call per doc</text>
  <text x="860" y="847" class="note">💡 Docs scoring below threshold never reach the LLM's context</text>
  <text x="860" y="871" class="note" fill="#00d9ff">💡 Retrieves from the same vector store built offline</text>

  <!-- Stage 3: Generate & Critique -->
  <rect x="50" y="960" width="1600" height="165" fill="none" stroke="#ff66ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
  <text x="70" y="984" class="stage-title" fill="#ff66ff">③ GENERATE &amp; CRITIQUE — Grounding Check</text>
  <g filter="url(#glow)">
    <rect x="70" y="1000" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="75" y="1005" width="180" height="90" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="165.0" y="1029" class="label" text-anchor="middle" font-size="16">📝 Generate</text>
    <text x="165.0" y="1053" class="data-label" text-anchor="middle">answer from</text>
    <text x="165.0" y="1071" class="data-label" text-anchor="middle">relevant context</text>
  </g>
  <line x1="260" y1="1050" x2="340" y2="1050" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="264.0" y="1036" width="72" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="300.0" y="1055" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Critique</text>
  <g filter="url(#glow)">
    <rect x="340" y="1000" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="345" y="1005" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="435.0" y="1024" class="label" text-anchor="middle" font-size="16">🔬 Support Score</text>
    <text x="435.0" y="1048" class="data-label" text-anchor="middle">is the answer grounded</text>
    <text x="435.0" y="1066" class="data-label" text-anchor="middle">in the context? 0.0-1.0</text>
  </g>
  <line x1="530" y1="1050" x2="610" y2="1050" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="536.0" y="1036" width="68" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="570.0" y="1055" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Accept</text>
  <g filter="url(#glow)">
    <rect x="610" y="1000" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="615" y="1005" width="180" height="90" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="705.0" y="1024" class="label" text-anchor="middle" font-size="16">✅ Final Answer</text>
    <text x="705.0" y="1048" class="data-label" text-anchor="middle">support ≥ threshold</text>
    <text x="705.0" y="1066" class="data-label" text-anchor="middle">default 0.7</text>
  </g>
  <text x="860" y="1028" class="note">💡 Best-scoring attempt across all iterations is returned, even if none pass</text>
  <text x="860" y="1052" class="note">💡 Reducing hallucination is the whole point of this critique step</text>

  <!-- Reflection loop: weak support sends us back to retrieval with a refined query.
       Kept within the Stage 2 / Stage 3 gap (920-960) so it never crosses Stage 1. -->
  <path d="M 260 1050 Q 40 950 70 845" stroke="#ffcc00" stroke-width="3" fill="none" marker-end="url(#arrowhead-yellow)" stroke-dasharray="5,4"/>
  <rect x="20.0" y="928" width="220" height="24" fill="#0a1628" opacity="0.95"/>
  <text x="130" y="946" class="data-label" text-anchor="middle" font-size="12" font-weight="600" fill="#ffcc00">↺ if unsupported: refine &amp; retry</text>

  <!-- Stage transition: relevant docs feed generation -->
  <path d="M 705.0 895 Q 110 947.5 165.0 1000" stroke="#ff00ff" stroke-width="3" fill="none" marker-end="url(#arrowhead-purple)" stroke-dasharray="7,5"/>
  <rect x="344.0" y="914.5" width="124" height="24" fill="#0a1628" opacity="0.95"/>
  <text x="406" y="932.5" class="data-label" text-anchor="middle" font-size="12" font-weight="600" fill="#ff00ff">context →</text>

  <!-- LEGEND -->
  <text x="55" y="1215" class="phase-title">[LEGEND]</text>
  <line x1="250" y1="1207" x2="295" y2="1207" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <text x="310" y="1212" class="data-label" font-size="12" font-weight="600">Primary Data Flow</text>
  <line x1="530" y1="1207" x2="575" y2="1207" stroke="#ff00ff" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrowhead-purple)"/>
  <text x="590" y="1212" class="data-label" font-size="12" font-weight="600">Stage Transition</text>
  <line x1="850" y1="1207" x2="895" y2="1207" stroke="#ffcc00" stroke-width="3" stroke-dasharray="5,4" marker-end="url(#arrowhead-yellow)"/>
  <text x="910" y="1212" class="data-label" font-size="12" font-weight="600">Reflection: Branch / Retry Loop</text>
</svg>
