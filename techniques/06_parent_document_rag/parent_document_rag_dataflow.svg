<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1170">
  <defs>
    <style>
      * { font-family: "Courier New", monospace; }
      .title { font-size: 36px; font-weight: 700; fill: #00d9ff; }
      .phase-title { font-size: 22px; font-weight: 700; fill: #00ffaa; }
      .stage-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; fill: #00ffaa; font-weight: 600; }
      .data-label { font-size: 12px; fill: #00d9ff; font-weight: 500; }
      .phase-label { font-size: 14px; fill: #0099ff; font-style: italic; }
      .description { font-size: 13px; fill: #00d9ff; opacity: 0.95; }
      .summary { font-size: 12px; fill: #aaffff; opacity: 0.9; }
      .note { font-size: 12px; fill: #aaffff; opacity: 0.85; }
    </style>
    <marker id="arrowhead-cyan" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00ffaa" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ff00ff" />
    </marker>
    <marker id="arrowhead-teal" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00d9ff" />
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a2540" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1700" height="1170" fill="#0a1628"/>
  <rect width="1700" height="1170" fill="url(#grid)"/>
  <text x="850" y="45" class="title" text-anchor="middle" filter="url(#glow)">Parent Document RAG Data Flow Architecture</text>

  <!-- OFFLINE PHASE -->
  <rect x="30" y="70" width="1640" height="420" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>
  <text x="55" y="108" class="phase-title">[OFFLINE PHASE]</text>
  <text x="55" y="132" class="phase-label">Parent/Child Splitting &amp; Dual Storage (One-Time — Shared Across All Queries)</text>
  <rect x="55" y="148" width="1590" height="55" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
  <text x="70" y="168" class="summary" font-weight="600">📌 SUMMARY: Documents are split into large parent chunks, then each parent is further split into</text>
  <text x="70" y="188" class="summary">small child chunks. Only children are embedded — parents are kept as-is for later lookup.</text>

  <g filter="url(#glow)">
    <rect x="55" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="60" y="240" width="180" height="90" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="150.0" y="269" class="label" text-anchor="middle" font-size="18">📄 Documents</text>
    <text x="150.0" y="293" class="data-label" text-anchor="middle">Raw Text</text>
  </g>
  <line x1="245" y1="285" x2="315" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="252.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="280.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Split</text>
  <g filter="url(#glow)">
    <rect x="315" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="320" y="240" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="410.0" y="269" class="label" text-anchor="middle" font-size="18">📦 Parent Chunks</text>
    <text x="410.0" y="293" class="data-label" text-anchor="middle">2000 chars</text>
  </g>
  <line x1="505" y1="285" x2="575" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="512.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="540.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Split</text>
  <g filter="url(#glow)">
    <rect x="575" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="580" y="240" width="180" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="670.0" y="269" class="label" text-anchor="middle" font-size="18">✂️ Child Chunks</text>
    <text x="670.0" y="293" class="data-label" text-anchor="middle">200 chars</text>
  </g>
  <line x1="765" y1="285" x2="835" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="772.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="800.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Embed</text>
  <g filter="url(#glow)">
    <rect x="835" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="840" y="240" width="180" height="90" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="930.0" y="269" class="label" text-anchor="middle" font-size="18">💾 Vector Store</text>
    <text x="930.0" y="293" class="data-label" text-anchor="middle">child embeddings only</text>
  </g>

  <path d="M 410 335 Q 350 365 315 393" stroke="#ff00ff" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-purple)"/>
  <rect x="322.0" y="358" width="56" height="24" fill="#0a1628" opacity="0.95"/>
  <text x="350.0" y="375" class="data-label" text-anchor="middle" font-size="12" font-weight="600" fill="#ff00ff">Keep</text>
  <g filter="url(#glow)">
    <rect x="315" y="397" width="190" height="78" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="320" y="402" width="180" height="68" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="410.0" y="428" class="label" text-anchor="middle" font-size="16">🗄️ Docstore</text>
    <text x="410.0" y="452" class="data-label" text-anchor="middle">parent text, keyed by ID</text>
  </g>

  <text x="1155" y="253" class="note" font-weight="600">💡 Parents are never embedded —</text>
  <text x="1155" y="273" class="note">only used for lookup after a child hit</text>

  <!-- ONLINE PHASE -->
  <text x="55" y="558" class="phase-title">[ONLINE PHASE]</text>
  <text x="55" y="582" class="phase-label">Child Retrieval → Parent Lookup → Grounded Generation (Per Query)</text>
  <rect x="55" y="598" width="1590" height="70" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
  <text x="70" y="620" class="summary" font-weight="600">📌 SUMMARY: The query is matched against small, focused child embeddings — precise semantic</text>
  <text x="70" y="636" class="summary">matching that a large chunk's diffuse embedding can't offer. Each child hit is then swapped for</text>
  <text x="70" y="652" class="summary">its full parent chunk (deduplicated), giving the LLM complete surrounding context to answer from.</text>
  <rect x="30" y="510" width="1640" height="640" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>

  <!-- Stage 1: Child Retrieval -->
  <rect x="50" y="690" width="1600" height="165" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
  <text x="70" y="714" class="stage-title" fill="#4ac0ff">① CHILD RETRIEVAL — Precise Matching</text>
  <g filter="url(#glow)">
    <rect x="70" y="730" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="75" y="735" width="180" height="90" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="165.0" y="759" class="label" text-anchor="middle" font-size="16">❓ Query</text>
    <text x="165.0" y="783" class="data-label" text-anchor="middle">User Input</text>
  </g>
  <line x1="260" y1="780" x2="340" y2="780" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="256.0" y="766" width="88" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="300.0" y="785" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Embed</text>
  <g filter="url(#glow)">
    <rect x="340" y="730" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="345" y="735" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="435.0" y="759" class="label" text-anchor="middle" font-size="16">🔍 Child Similarity Search</text>
    <text x="435.0" y="783" class="data-label" text-anchor="middle">kNN vs. child</text>
    <text x="435.0" y="801" class="data-label" text-anchor="middle">embeddings, k=top_k</text>
  </g>
  <line x1="530" y1="780" x2="610" y2="780" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="536.0" y="766" width="68" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="570.0" y="785" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Match</text>
  <g filter="url(#glow)">
    <rect x="610" y="730" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="615" y="735" width="180" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="705.0" y="759" class="label" text-anchor="middle" font-size="16">📋 Child Hits</text>
    <text x="705.0" y="783" class="data-label" text-anchor="middle">top-K children,</text>
    <text x="705.0" y="801" class="data-label" text-anchor="middle">each tagged with parent_id</text>
  </g>
  <text x="860" y="764" class="note">💡 Small chunks embed precisely — no diffuse averaging over long text</text>
  <text x="860" y="788" class="note">💡 Every child chunk stores a pointer back to its parent</text>

  <!-- Stage 2: Parent Lookup & Generation -->
  <rect x="50" y="895" width="1600" height="165" fill="none" stroke="#00ffaa" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
  <text x="70" y="919" class="stage-title" fill="#00ffaa">② PARENT LOOKUP — Full Context</text>
  <g filter="url(#glow)">
    <rect x="70" y="935" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="75" y="940" width="180" height="90" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="165.0" y="964" class="label" text-anchor="middle" font-size="16">🔗 Map to Parents</text>
    <text x="165.0" y="988" class="data-label" text-anchor="middle">Docstore lookup</text>
    <text x="165.0" y="1006" class="data-label" text-anchor="middle">by parent_id, deduped</text>
  </g>
  <line x1="260" y1="985" x2="340" y2="985" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="266.0" y="971" width="76" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="304.0" y="990" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Fetch</text>
  <g filter="url(#glow)">
    <rect x="340" y="935" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="345" y="940" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="435.0" y="964" class="label" text-anchor="middle" font-size="16">📖 Parent Chunks</text>
    <text x="435.0" y="988" class="data-label" text-anchor="middle">full surrounding</text>
    <text x="435.0" y="1006" class="data-label" text-anchor="middle">context, deduplicated</text>
  </g>
  <line x1="530" y1="985" x2="610" y2="985" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="540.0" y="971" width="60" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="570.0" y="990" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Prompt</text>
  <g filter="url(#glow)">
    <rect x="610" y="935" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="615" y="940" width="180" height="90" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="705.0" y="964" class="label" text-anchor="middle" font-size="16">✅ LLM Answer</text>
    <text x="705.0" y="988" class="data-label" text-anchor="middle">Grounded in full</text>
    <text x="705.0" y="1006" class="data-label" text-anchor="middle">parent context</text>
  </g>
  <text x="860" y="963" class="note">💡 Looks up each child hit's parent_id in the Docstore built offline</text>
  <text x="860" y="987" class="note">💡 Multiple child hits from the same parent collapse to one context block</text>

  <!-- Stage transition -->
  <path d="M 705.0 830 Q 110 882.5 165.0 935" stroke="#ff00ff" stroke-width="3" fill="none" marker-end="url(#arrowhead-purple)" stroke-dasharray="7,5"/>
  <rect x="103.0" y="869.5" width="124" height="24" fill="#0a1628" opacity="0.95"/>
  <text x="165" y="887.5" class="data-label" text-anchor="middle" font-size="12" font-weight="600" fill="#ff00ff">K hits →</text>

  <!-- Reused offline index -->
  <path d="M 930.0 335 Q 697.5 565.0 435.0 730" stroke="#00d9ff" stroke-width="3" fill="none" marker-end="url(#arrowhead-teal)" stroke-dasharray="7,5"/>
  <rect x="605.5" y="552.0" width="124" height="24" fill="#0a1628" opacity="0.95"/>
  <text x="667.5" y="570.0" class="data-label" text-anchor="middle" font-size="12" font-weight="600" fill="#00d9ff">reused index</text>

  <!-- LEGEND -->
  <text x="55" y="1110" class="phase-title">[LEGEND]</text>
  <line x1="250" y1="1102" x2="295" y2="1102" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <text x="310" y="1107" class="data-label" font-size="12" font-weight="600">Primary Data Flow (within stage)</text>
  <line x1="650" y1="1102" x2="695" y2="1102" stroke="#ff00ff" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrowhead-purple)"/>
  <text x="710" y="1107" class="data-label" font-size="12" font-weight="600">Stage Transition</text>
  <line x1="990" y1="1102" x2="1035" y2="1102" stroke="#00d9ff" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrowhead-teal)"/>
  <text x="1050" y="1107" class="data-label" font-size="12" font-weight="600">Reused Offline Index</text>
  <line x1="1290" y1="1102" x2="1325" y2="1102" stroke="#ff00ff" stroke-width="2.5" marker-end="url(#arrowhead-purple)"/>
  <text x="1340" y="1107" class="data-label" font-size="12" font-weight="600">Offline Index Branch</text>
</svg>
