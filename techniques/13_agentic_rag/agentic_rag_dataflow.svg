<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1415">
  <defs>
    <style>
      * { font-family: "Courier New", monospace; }
      .title { font-size: 36px; font-weight: 700; fill: #00d9ff; }
      .phase-title { font-size: 22px; font-weight: 700; fill: #00ffaa; }
      .stage-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; fill: #00ffaa; font-weight: 600; }
      .small-label { font-size: 13px; fill: #00ffaa; font-weight: 600; }
      .data-label { font-size: 12px; fill: #00d9ff; font-weight: 500; }
      .phase-label { font-size: 14px; fill: #0099ff; font-style: italic; }
      .description { font-size: 13px; fill: #00d9ff; opacity: 0.95; }
      .summary { font-size: 12px; fill: #aaffff; opacity: 0.9; }
      .note { font-size: 12px; fill: #aaffff; opacity: 0.85; }
    </style>
    <marker id="arrowhead-cyan" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00ffaa" />
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00ff00" />
    </marker>
    <marker id="arrowhead-yellow" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ffcc00" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ff00ff" />
    </marker>
    <marker id="arrowhead-pink" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ff66ff" />
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a2540" stroke-width="0.5"/>
    </pattern>
  </defs>
  
<rect width="1700" height="1415" fill="#0a1628"/><rect width="1700" height="1415" fill="url(#grid)"/>
<text x="850" y="45" class="title" text-anchor="middle" filter="url(#glow)">Agentic RAG Data Flow Architecture</text>
<rect x="30" y="70" width="1640" height="280" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>
<text x="55" y="108" class="phase-title" >[OFFLINE PHASE]</text>
<text x="55" y="132" class="phase-label" >Indexing &amp; Vector Store Preparation (One-Time — Queried Repeatedly by the Agent)</text>
<rect x="55" y="148" width="1590" height="55" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
<text x="70" y="168" class="summary" font-weight="600">📌 SUMMARY: Identical to Naive RAG — documents are chunked, embedded, and indexed once. The agent</text>
<text x="70" y="188" class="summary" >then treats the index as a TOOL it may call zero, one, or many times per question.</text>
<g filter="url(#glow)"><rect x="55" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="60" y="240" width="180" height="90" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="8"/><text x="150.0" y="277.0" class="label" text-anchor="middle" font-size="16">📄 Documents</text><text x="150.0" y="299.0" class="data-label" text-anchor="middle">Raw Text</text></g>
<g filter="url(#glow)"><rect x="315" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="320" y="240" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="410.0" y="277.0" class="label" text-anchor="middle" font-size="16">✂️ Chunks</text><text x="410.0" y="299.0" class="data-label" text-anchor="middle">512 tok, overlap=50</text></g>
<g filter="url(#glow)"><rect x="575" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="580" y="240" width="180" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="670.0" y="277.0" class="label" text-anchor="middle" font-size="16">🧠 Embeddings</text><text x="670.0" y="299.0" class="data-label" text-anchor="middle">nomic-embed-text</text></g>
<g filter="url(#glow)"><rect x="835" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="840" y="240" width="180" height="90" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="930.0" y="277.0" class="label" text-anchor="middle" font-size="16">💾 Vector Store</text><text x="930.0" y="299.0" class="data-label" text-anchor="middle">ChromaDB</text></g>
<line x1="245" y1="285" x2="315" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="236.0" y="271.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="280.0" y="290.0" class="data-label" text-anchor="middle" font-weight="600">Split</text>
<line x1="505" y1="285" x2="575" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="496.0" y="271.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="540.0" y="290.0" class="data-label" text-anchor="middle" font-weight="600">Embed</text>
<line x1="765" y1="285" x2="835" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="756.0" y="271.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="800.0" y="290.0" class="data-label" text-anchor="middle" font-weight="600">Store</text>
<text x="1155" y="253" class="note" font-weight="600">💡 Runs once; the agent may query it many times</text>
<rect x="30" y="370" width="1640" height="1015" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>
<text x="55" y="418" class="phase-title" >[ONLINE PHASE]</text>
<text x="55" y="442" class="phase-label" >Reason → Act → Observe (loop, bounded by max_iterations) → Final Answer (Per Query)</text>
<rect x="55" y="458" width="1590" height="70" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
<text x="70" y="480" class="summary" font-weight="600">📌 SUMMARY: An LLM runs a text-based ReAct loop. Each step it writes Thought / Action / Action Input,</text>
<text x="70" y="496" class="summary" >the loop runs the tool and feeds back an Observation, and it repeats until the LLM writes Final Answer.</text>
<text x="70" y="512" class="summary" >If the step budget runs out, one extra LLM call forces a final answer from what was gathered.</text>
<rect x="50" y="545" width="1600" height="200" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
<text x="70" y="569" class="stage-title" fill="#4ac0ff">① REASON — LLM Chooses the Next Step</text>
<g filter="url(#glow)"><rect x="70" y="585" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="75" y="590" width="180" height="90" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="165.0" y="627.0" class="label" text-anchor="middle" font-size="16">❓ Query</text><text x="165.0" y="649.0" class="data-label" text-anchor="middle">User Input</text></g>
<line x1="260" y1="635" x2="340" y2="635" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="256.0" y="621.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="300.0" y="640.0" class="data-label" text-anchor="middle" font-weight="600">Prompt</text>
<g filter="url(#glow)"><rect x="340" y="585" width="250" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="345" y="590" width="240" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="465.0" y="627.0" class="label" text-anchor="middle" font-size="16">🤖 ReAct Step</text><text x="465.0" y="649.0" class="data-label" text-anchor="middle">Thought + Action</text><text x="465.0" y="667.0" class="data-label" text-anchor="middle">+ scratchpad so far</text></g>
<line x1="590" y1="635" x2="670" y2="635" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="586.0" y="621.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="630.0" y="640.0" class="data-label" text-anchor="middle" font-weight="600">Parse</text>
<g filter="url(#glow)"><rect x="670" y="585" width="250" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="675" y="590" width="240" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="795.0" y="627.0" class="label" text-anchor="middle" font-size="16">🔍 parse_step</text><text x="795.0" y="649.0" class="data-label" text-anchor="middle">first marker wins</text><text x="795.0" y="667.0" class="data-label" text-anchor="middle">strips &lt;think&gt; traces</text></g>
<text x="960" y="605" class="note" fill="#ffcc00">• Action found → run tool (②)</text>
<text x="960" y="627" class="note" fill="#00ff00">• Final Answer found → finish (③)</text>
<text x="960" y="649" class="note" >• Unformatted text → treated as final answer</text>
<rect x="50" y="775" width="1600" height="300" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
<text x="70" y="799" class="stage-title" fill="#4ac0ff">② ACT — Execute the Chosen Tool</text>
<g filter="url(#glow)"><rect x="70" y="815" width="250" height="95" fill="none" stroke="#00ff00" stroke-width="3" rx="10"/><rect x="75" y="820" width="240" height="85" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="195.0" y="854.5" class="label" text-anchor="middle" font-size="16">🟢 vector_retrieval</text><text x="195.0" y="876.5" class="data-label" text-anchor="middle">top-k chunks from index</text><text x="195.0" y="894.5" class="data-label" text-anchor="middle">agent may re-query</text></g>
<g filter="url(#glow)"><rect x="360" y="815" width="250" height="95" fill="none" stroke="#ffcc00" stroke-width="3" rx="10"/><rect x="365" y="820" width="240" height="85" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="485.0" y="854.5" class="label" text-anchor="middle" font-size="16">🟡 calculator</text><text x="485.0" y="876.5" class="data-label" text-anchor="middle">AST-whitelisted math</text><text x="485.0" y="894.5" class="data-label" text-anchor="middle">no eval(), exponent cap</text></g>
<g filter="url(#glow)"><rect x="650" y="815" width="250" height="95" fill="none" stroke="#ff66ff" stroke-width="3" rx="10"/><rect x="655" y="820" width="240" height="85" fill="none" stroke="#ff66ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="775.0" y="854.5" class="label" text-anchor="middle" font-size="16">🟣 unknown / failed</text><text x="775.0" y="876.5" class="data-label" text-anchor="middle">Error: ... text</text><text x="775.0" y="894.5" class="data-label" text-anchor="middle">agent can recover</text></g>
<line x1="195" y1="910" x2="195" y2="975" stroke="#00ff00" stroke-width="3.5" marker-end="url(#arrowhead-green)"/>
<line x1="485" y1="910" x2="485" y2="975" stroke="#ffcc00" stroke-width="3.5" marker-end="url(#arrowhead-yellow)"/>
<line x1="775" y1="910" x2="775" y2="975" stroke="#ff66ff" stroke-width="3.5" marker-end="url(#arrowhead-pink)"/>
<g filter="url(#glow)"><rect x="70" y="975" width="830" height="80" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="75" y="980" width="820" height="70" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="8"/><text x="485.0" y="1007.0" class="label" text-anchor="middle" font-size="16">👁️ Observation</text><text x="485.0" y="1029.0" class="data-label" text-anchor="middle">tool result text appended to the scratchpad</text><text x="485.0" y="1047.0" class="data-label" text-anchor="middle">(the next ReAct step sees it)</text></g>
<path d="M 900 1015 L 1570 1015 L 1570 760 L 465 760 L 465 685" stroke="#00ffaa" stroke-width="3" fill="none" marker-end="url(#arrowhead-cyan)"/>
<rect x="950" y="746" width="140" height="26" fill="#0a1628" opacity="0.95"/><text x="1020" y="765" class="data-label" text-anchor="middle" font-weight="600">next iteration</text>
<text x="960" y="835" class="note" font-weight="600">🛡️ calculator never calls eval()</text>
<text x="960" y="857" class="note" font-weight="600">🛡️ tool exceptions become observations</text>
<text x="960" y="879" class="note" >🚫 web_search / code_executor omitted</text>
<text x="960" y="899" class="note" >(API key / unsandboxed code risk)</text>
<rect x="50" y="1105" width="1600" height="270" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
<text x="70" y="1129" class="stage-title" fill="#4ac0ff">③ FINISH — Return Answer + Agent Trace</text>
<g filter="url(#glow)"><rect x="70" y="1150" width="250" height="100" fill="none" stroke="#ff66ff" stroke-width="3" rx="10"/><rect x="75" y="1155" width="240" height="90" fill="none" stroke="#ff66ff" stroke-width="1.5" opacity="0.4" rx="8"/><text x="195.0" y="1192.0" class="label" text-anchor="middle" font-size="16">⏱️ Budget Exhausted</text><text x="195.0" y="1214.0" class="data-label" text-anchor="middle">max_iterations reached</text></g>
<line x1="320" y1="1200" x2="400" y2="1200" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<rect x="316.0" y="1186.0" width="88" height="26" fill="#0a1628" opacity="0.95"/><text x="360.0" y="1205.0" class="data-label" text-anchor="middle" font-weight="600">Force</text>
<g filter="url(#glow)"><rect x="400" y="1150" width="250" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/><rect x="405" y="1155" width="240" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="525.0" y="1192.0" class="label" text-anchor="middle" font-size="16">🧾 Forced Final</text><text x="525.0" y="1214.0" class="data-label" text-anchor="middle">one extra LLM call</text><text x="525.0" y="1232.0" class="data-label" text-anchor="middle">answer from scratchpad</text></g>
<line x1="650" y1="1200" x2="730" y2="1200" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
<g filter="url(#glow)"><rect x="730" y="1150" width="300" height="100" fill="none" stroke="#00ff00" stroke-width="3" rx="10"/><rect x="735" y="1155" width="290" height="90" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.4" rx="8"/><text x="880.0" y="1192.0" class="label" text-anchor="middle" font-size="16">📦 RAGResult</text><text x="880.0" y="1214.0" class="data-label" text-anchor="middle">answer + sources</text><text x="880.0" y="1232.0" class="data-label" text-anchor="middle">steps + metadata</text></g>
<path d="M 920 670 L 1620 670 L 1620 1200 L 1030 1200" stroke="#00ff00" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
<rect x="1255" y="1186" width="140" height="26" fill="#0a1628" opacity="0.95"/><text x="1325" y="1205" class="data-label" text-anchor="middle" font-weight="600">Final Answer</text>
<text x="70" y="1300" class="note" font-weight="600">Empty LLM output (e.g. a reasoning model exhausting max_tokens) returns an explicit message, not a blank answer.</text>
<text x="70" y="1330" class="note" >metadata: num_agent_steps, tools_used, retrieval_calls · intermediate_steps: thought, action, action_input, observation</text>
</svg>