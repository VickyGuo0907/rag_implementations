name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Compile check
        run: |
          uv run python -m py_compile \
            main.py app.py \
            core/*.py \
            techniques/registry.py \
            techniques/__init__.py \
            techniques/*/langchain_impl.py \
            techniques/*/llamaindex_impl.py

      - name: Run test suite
        run: uv run pytest tests/ -v

      - name: CLI smoke test
        run: |
          uv run python main.py list > /dev/null
          uv run python main.py info naive_rag > /dev/null