<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1160">
  <defs>
    <style>
      * { font-family: "Courier New", monospace; }
      .title { font-size: 36px; font-weight: 700; fill: #00d9ff; }
      .phase-title { font-size: 22px; font-weight: 700; fill: #00ffaa; }
      .stage-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; fill: #00ffaa; font-weight: 600; }
      .small-label { font-size: 13px; fill: #00ffaa; font-weight: 600; }
      .data-label { font-size: 12px; fill: #00d9ff; font-weight: 500; }
      .phase-label { font-size: 14px; fill: #0099ff; font-style: italic; }
      .description { font-size: 13px; fill: #00d9ff; opacity: 0.95; }
      .summary { font-size: 12px; fill: #aaffff; opacity: 0.9; }
      .note { font-size: 12px; fill: #aaffff; opacity: 0.85; }
    </style>
    <marker id="arrowhead-cyan" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00ffaa" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#ff00ff" />
    </marker>
    <marker id="arrowhead-teal" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#00d9ff" />
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a2540" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1700" height="1160" fill="#0a1628"/>
  <rect width="1700" height="1160" fill="url(#grid)"/>
  <text x="850" y="45" class="title" text-anchor="middle" filter="url(#glow)">Query Transform RAG Data Flow Architecture</text>

  <!-- OFFLINE PHASE -->
  <rect x="30" y="70" width="1640" height="280" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>
  <text x="55" y="108" class="phase-title">[OFFLINE PHASE]</text>
  <text x="55" y="132" class="phase-label">Indexing &amp; Vector Store Preparation (One-Time — Shared Across All Queries)</text>
  <rect x="55" y="148" width="1590" height="55" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
  <text x="70" y="168" class="summary" font-weight="600">📌 SUMMARY: Identical to Naive RAG — documents are chunked, embedded, and indexed into a</text>
  <text x="70" y="188" class="summary">vector store once. All query transformation happens in the ONLINE phase below.</text>
  <g filter="url(#glow)">
    <rect x="55" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="60" y="240" width="180" height="90" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="150.0" y="269" class="label" text-anchor="middle" font-size="18">📄 Documents</text>
    <text x="150.0" y="293" class="data-label" text-anchor="middle">Raw Text</text>
  </g>
  <line x1="245" y1="285" x2="315" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="252.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="280.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Split</text>
  <g filter="url(#glow)">
    <rect x="315" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="320" y="240" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="410.0" y="269" class="label" text-anchor="middle" font-size="18">✂️ Chunks</text>
    <text x="410.0" y="293" class="data-label" text-anchor="middle">512 tok, overlap=50</text>
  </g>
  <line x1="505" y1="285" x2="575" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="512.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="540.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Embed</text>
  <g filter="url(#glow)">
    <rect x="575" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="580" y="240" width="180" height="90" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="670.0" y="269" class="label" text-anchor="middle" font-size="18">🧠 Embeddings</text>
    <text x="670.0" y="293" class="data-label" text-anchor="middle">nomic-embed-text</text>
  </g>
  <line x1="765" y1="285" x2="835" y2="285" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="772.0" y="271" width="56" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="800.0" y="290" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Store</text>
  <g filter="url(#glow)">
    <rect x="835" y="235" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="840" y="240" width="180" height="90" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="930.0" y="269" class="label" text-anchor="middle" font-size="18">💾 Vector Store</text>
    <text x="930.0" y="293" class="data-label" text-anchor="middle">ChromaDB</text>
  </g>
  <text x="1155" y="253" class="note" font-weight="600">💡 Runs once per document set, reused for unlimited queries below</text>

  <!-- ONLINE PHASE -->
  <text x="55" y="418" class="phase-title">[ONLINE PHASE]</text>
  <text x="55" y="442" class="phase-label">Query Transformation → Deduplicated Retrieval → Grounded Generation (Per Query)</text>
  <rect x="55" y="458" width="1590" height="70" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4" rx="6"/>
  <text x="70" y="480" class="summary" font-weight="600">📌 SUMMARY: The query is expanded by up to three independent strategies — step-back,</text>
  <text x="70" y="496" class="summary">decomposition, and multi-query — each contributing extra retrieval queries. Every variant's</text>
  <text x="70" y="512" class="summary">results are merged and deduplicated before the LLM answers using the original question.</text>
  <rect x="30" y="370" width="1640" height="740" fill="none" stroke="#0099ff" stroke-width="2.5" stroke-dasharray="8,4" rx="12" opacity="0.6"/>

  <!-- Stage 1: Query Transformation (fan-out / fan-in) -->
  <rect x="50" y="550" width="1600" height="300" fill="none" stroke="#4ac0ff" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
  <text x="70" y="574" class="stage-title" fill="#4ac0ff">① QUERY TRANSFORMATION — Multi-Strategy Expansion</text>
  <text x="70" y="595" class="note" font-style="italic">(each branch below only runs if enabled in config.yaml → strategies)</text>

  <g filter="url(#glow)">
    <rect x="70" y="655" width="190" height="90" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="75" y="660" width="180" height="80" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="165.0" y="695" class="label" text-anchor="middle" font-size="16">❓ Query</text>
    <text x="165.0" y="719" class="data-label" text-anchor="middle">User Input</text>
  </g>

  <g filter="url(#glow)">
    <rect x="340" y="610" width="260" height="65" fill="none" stroke="#00d9ff" stroke-width="2.5" rx="8"/>
    <rect x="344" y="614" width="252" height="57" fill="none" stroke="#ffaa00" stroke-width="1.2" opacity="0.4" rx="6"/>
    <text x="470.0" y="636" class="small-label" text-anchor="middle" font-size="14">🔭 Step-Back</text>
    <text x="470.0" y="656" class="data-label" text-anchor="middle" font-size="10">Abstract to a higher-level Q</text>
  </g>
  <g filter="url(#glow)">
    <rect x="340" y="693" width="260" height="65" fill="none" stroke="#00d9ff" stroke-width="2.5" rx="8"/>
    <rect x="344" y="697" width="252" height="57" fill="none" stroke="#aa00ff" stroke-width="1.2" opacity="0.4" rx="6"/>
    <text x="470.0" y="719" class="small-label" text-anchor="middle" font-size="14">🧩 Decompose</text>
    <text x="470.0" y="739" class="data-label" text-anchor="middle" font-size="11">N simpler sub-questions</text>
  </g>
  <g filter="url(#glow)">
    <rect x="340" y="776" width="260" height="65" fill="none" stroke="#00d9ff" stroke-width="2.5" rx="8"/>
    <rect x="344" y="780" width="252" height="57" fill="none" stroke="#00ffaa" stroke-width="1.2" opacity="0.4" rx="6"/>
    <text x="470.0" y="802" class="small-label" text-anchor="middle" font-size="14">🔀 Multi-Query</text>
    <text x="470.0" y="822" class="data-label" text-anchor="middle" font-size="10">N differently-worded rephrasings</text>
  </g>

  <path d="M 260 690 Q 300 642 340 642" stroke="#00ffaa" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-cyan)"/>
  <path d="M 260 700 L 340 725" stroke="#00ffaa" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-cyan)"/>
  <path d="M 260 710 Q 300 780 340 808" stroke="#00ffaa" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-cyan)"/>

  <g filter="url(#glow)">
    <rect x="660" y="610" width="220" height="231" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="665" y="615" width="210" height="221" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="770.0" y="700" class="label" text-anchor="middle" font-size="16">📚 Query Variants</text>
    <text x="770.0" y="724" class="data-label" text-anchor="middle">original + any enabled</text>
    <text x="770.0" y="742" class="data-label" text-anchor="middle">step-back / sub-Qs /</text>
    <text x="770.0" y="760" class="data-label" text-anchor="middle">rephrasings</text>
  </g>

  <path d="M 600 642 L 660 680" stroke="#00ffaa" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-cyan)"/>
  <path d="M 600 725 L 660 725" stroke="#00ffaa" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-cyan)"/>
  <path d="M 600 808 L 660 770" stroke="#00ffaa" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-cyan)"/>

  <text x="920" y="650" class="note">💡 Each enabled strategy adds its own retrieval queries</text>
  <text x="920" y="674" class="note">💡 Original query is always included alongside the variants</text>
  <text x="920" y="698" class="note">💡 Strategies are additive, not exclusive — mix and match</text>
  <text x="920" y="722" class="note">💡 Same idea as Advanced RAG's multi-query, generalized to 3 modes</text>

  <!-- Stage 2: Retrieval & Generation -->
  <rect x="50" y="890" width="1600" height="165" fill="none" stroke="#00ffaa" stroke-width="2" stroke-dasharray="6,3" rx="10" opacity="0.7"/>
  <text x="70" y="914" class="stage-title" fill="#00ffaa">② RETRIEVAL &amp; GENERATION — Deduplicated Answer</text>
  <g filter="url(#glow)">
    <rect x="70" y="930" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="75" y="935" width="180" height="90" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="165.0" y="959" class="label" text-anchor="middle" font-size="16">🔍 Retrieve per Variant</text>
    <text x="165.0" y="983" class="data-label" text-anchor="middle">kNN per query,</text>
    <text x="165.0" y="1001" class="data-label" text-anchor="middle">k=5 each</text>
  </g>
  <line x1="260" y1="980" x2="340" y2="980" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="248.0" y="966" width="104" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="300.0" y="985" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Union+Dedupe</text>
  <g filter="url(#glow)">
    <rect x="340" y="930" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="345" y="935" width="180" height="90" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="435.0" y="959" class="label" text-anchor="middle" font-size="16">🧹 Deduplicated Context</text>
    <text x="435.0" y="983" class="data-label" text-anchor="middle">Unique chunks by</text>
    <text x="435.0" y="1001" class="data-label" text-anchor="middle">content hash</text>
  </g>
  <line x1="530" y1="980" x2="610" y2="980" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <rect x="540.0" y="966" width="60" height="26" fill="#0a1628" opacity="0.95"/>
  <text x="570.0" y="985" class="data-label" text-anchor="middle" font-size="12" font-weight="600">Prompt</text>
  <g filter="url(#glow)">
    <rect x="610" y="930" width="190" height="100" fill="none" stroke="#00d9ff" stroke-width="3" rx="10"/>
    <rect x="615" y="935" width="180" height="90" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.4" rx="8"/>
    <text x="705.0" y="959" class="label" text-anchor="middle" font-size="16">✅ LLM Answer</text>
    <text x="705.0" y="983" class="data-label" text-anchor="middle">Synthesized from</text>
    <text x="705.0" y="1001" class="data-label" text-anchor="middle">combined context</text>
  </g>
  <text x="860" y="963" class="note">💡 Original question (not a variant) is used for final generation</text>
  <text x="860" y="987" class="note">💡 Wider candidate pool → pair with reranking for higher precision</text>

  <!-- Stage transition: query variants feed retrieval -->
  <path d="M 770.0 841 Q 300 885 165.0 930" stroke="#ff00ff" stroke-width="3" fill="none" marker-end="url(#arrowhead-purple)" stroke-dasharray="7,5"/>
  <rect x="238.0" y="864.5" width="124" height="24" fill="#0a1628" opacity="0.95"/>
  <text x="300" y="882.5" class="data-label" text-anchor="middle" font-size="12" font-weight="600" fill="#ff00ff">N variants →</text>

  <!-- Reused offline index feeds retrieval -->
  <path d="M 930.0 335 Q 697.5 632.5 165.0 930" stroke="#00d9ff" stroke-width="3" fill="none" marker-end="url(#arrowhead-teal)" stroke-dasharray="7,5"/>
  <rect x="635.5" y="620.5" width="124" height="24" fill="#0a1628" opacity="0.95"/>
  <text x="697.5" y="638.5" class="data-label" text-anchor="middle" font-size="12" font-weight="600" fill="#00d9ff">reused index</text>

  <!-- LEGEND -->
  <text x="55" y="1100" class="phase-title">[LEGEND]</text>
  <line x1="250" y1="1092" x2="295" y2="1092" stroke="#00ffaa" stroke-width="3.5" marker-end="url(#arrowhead-cyan)"/>
  <text x="310" y="1097" class="data-label" font-size="12" font-weight="600">Primary Data Flow (within stage)</text>
  <line x1="650" y1="1092" x2="695" y2="1092" stroke="#ff00ff" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrowhead-purple)"/>
  <text x="710" y="1097" class="data-label" font-size="12" font-weight="600">Stage Transition</text>
  <line x1="990" y1="1092" x2="1035" y2="1092" stroke="#00d9ff" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrowhead-teal)"/>
  <text x="1050" y="1097" class="data-label" font-size="12" font-weight="600">Reused Offline Index</text>
</svg>
