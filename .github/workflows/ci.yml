name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - "config/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # SHA-pinned for supply-chain security; v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        # SHA-pinned; v5
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Compile check
        run: |
          uv run python -m py_compile \
            main.py app.py \
            core/*.py \
            techniques/registry.py \
            techniques/__init__.py \
            techniques/*/langchain_impl.py \
            techniques/*/llamaindex_impl.py

      - name: Run test suite
        run: uv run pytest tests/ -v

      - name: CLI smoke test
        run: |
          uv run python main.py list > /dev/null
          uv run python main.py info naive_rag > /dev/null